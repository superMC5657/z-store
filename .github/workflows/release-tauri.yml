# CD: Tauri 三平台(Windows/Linux/macOS)构建与双清单发布
#
# 架构: 并行打包 -> 收集 artifacts -> 统一发布;
# 项目配置完全由 .github/release.env 控制，发版工作流直通构建（解耦 CI 门禁，避免 Tag 双跑）。
#
# 需要用到的 repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY          = 私钥(base64)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 私钥密码(若有)
#   RELEASES_PAT                       = 对 RELEASES_REPO 有写入权限的 GitHub PAT
name: Release Tauri

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (如 v0.2.0), 手动触发时必填'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  # 步骤 1: Windows/Linux/macOS 并行打包 (带签名并上传 artifacts)
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            bundles: nsis
          - os: ubuntu-22.04
            platform: linux-x86_64
            bundles: deb,appimage
          - os: macos-latest
            platform: macos
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # 优化 Windows 磁盘 IO，避免杀毒实时扫描海量编译临时文件
      - name: Optimize Windows Defender for Rust builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$HOME\.cargo" -ErrorAction SilentlyContinue

      # Tauri v2 Linux 系统依赖（剔除推荐包加速安装，换源规避 Azure 节点限速）
      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list || true
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file patchelf libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Rust 编译构建
      - uses: dtolnay/rust-toolchain@stable
      - name: Add macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 核心步骤：打包安装包并签名
      - name: Build Tauri bundle (signed)
        if: runner.os != 'macOS'
        run: pnpm tauri build --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: '1'

      # macOS 单机产分架构双包：只装一次依赖，分别编译 Apple Silicon 与 Intel 安装包及 updater 包
      - name: Build Tauri bundle (signed, macOS dual-arch)
        if: runner.os == 'macOS'
        run: |
          pnpm tauri build --target aarch64-apple-darwin --bundles ${{ matrix.bundles }}
          pnpm tauri build --target x86_64-apple-darwin --bundles ${{ matrix.bundles }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # 收集产物: windows = exe+sig; macos = 各自 .app.tar.gz+sig 与 .dmg; linux = AppImage+sig 与 deb
      - name: Collect artifacts
        shell: bash
        run: |
          set -e
          if [ "${{ runner.os }}" = "Windows" ]; then
            EXE=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -1)
            if [ -z "$EXE" ]; then
              echo "::error::未找到 windows-x86_64 安装包"
              exit 1
            fi
            BASE=$(basename "$EXE")
            SAFE="${BASE// /.}"

            mkdir -p artifacts/windows-x86_64
            cp "$EXE" "artifacts/windows-x86_64/$SAFE"
            if [ -f "$EXE.sig" ]; then
              cp "$EXE.sig" "artifacts/windows-x86_64/$SAFE.sig"
            fi
          elif [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p artifacts/darwin-aarch64 artifacts/darwin-x86_64 artifacts/dmg
            collect_macos_arch() {
              local rust_target="$1"
              local tauri_target="$2"
              local arch_tag="$3"

              local tar_file
              tar_file=$(ls "src-tauri/target/$rust_target/release/bundle/macos/"*.app.tar.gz 2>/dev/null | head -1 || true)
              local dmg_file
              dmg_file=$(ls "src-tauri/target/$rust_target/release/bundle/dmg/"*.dmg 2>/dev/null | head -1 || true)

              if [ -z "$tar_file" ] || [ -z "$dmg_file" ]; then
                echo "::error::未找到 $tauri_target 安装包 (.app.tar.gz / .dmg)"
                exit 1
              fi

              local tar_base tar_safe
              tar_base=$(basename "$tar_file")
              tar_safe="${tar_base// /.}"
              if [[ "$tar_safe" != *"$arch_tag"* && "$tar_safe" != *"x86_64"* ]]; then
                tar_safe="${tar_safe%.app.tar.gz}_${arch_tag}.app.tar.gz"
              fi
              cp "$tar_file" "artifacts/$tauri_target/$tar_safe"
              if [ -f "$tar_file.sig" ]; then
                cp "$tar_file.sig" "artifacts/$tauri_target/$tar_safe.sig"
              fi

              local dmg_base dmg_safe
              dmg_base=$(basename "$dmg_file")
              dmg_safe="${dmg_base// /.}"
              if [[ "$dmg_safe" != *"$arch_tag"* && "$dmg_safe" != *"x86_64"* ]]; then
                dmg_safe="${dmg_safe%.dmg}_${arch_tag}.dmg"
              fi
              cp "$dmg_file" "artifacts/dmg/$dmg_safe"
            }

            collect_macos_arch "aarch64-apple-darwin" "darwin-aarch64" "aarch64"
            collect_macos_arch "x86_64-apple-darwin" "darwin-x86_64" "x64"
          else
            APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -1)
            DEB=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1)
            if [ -z "$APPIMAGE" ] || [ -z "$DEB" ]; then
              echo "::error::未找到 linux-x86_64 安装包 (AppImage/deb)"
              exit 1
            fi

            mkdir -p artifacts/linux-x86_64 artifacts/deb
            cp "$APPIMAGE" artifacts/linux-x86_64/
            if [ -f "$APPIMAGE.sig" ]; then
              cp "$APPIMAGE.sig" artifacts/linux-x86_64/
            fi
            cp "$DEB" artifacts/deb/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: artifacts
          if-no-files-found: error
          compression-level: 1

  # 步骤 2: 统一发布 —— 合并三平台产物，一次性写 latest.json 并原子发布
  publish:
    name: Publish Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Load config & validate tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::非法 tag 格式，必须符合 SemVer 格式 (如 v0.1.0 或 v1.0.0-rc.1，当前: $TAG)"
            exit 1
          fi

          if [ ! -f .github/release.env ]; then
            echo "::error::未找到配置文件 .github/release.env，请创建该文件并定义 APP_NAME 与 RELEASES_REPO"
            exit 1
          fi

          source .github/release.env
          if [ -z "$APP_NAME" ] || [ -z "$RELEASES_REPO" ]; then
            echo "::error::.github/release.env 必须定义非空的 APP_NAME 与 RELEASES_REPO"
            exit 1
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "RELEASES_REPO=$RELEASES_REPO" >> "$GITHUB_ENV"
          echo "已加载配置: APP_NAME=$APP_NAME, RELEASES_REPO=$RELEASES_REPO"

      - name: Generate latest.json
        shell: bash
        run: |
          set -e
          EXE=$(basename "$(ls artifacts/windows-x86_64/*.exe 2>/dev/null | head -1 || true)")
          APPIMAGE=$(basename "$(ls artifacts/linux-x86_64/*.AppImage 2>/dev/null | head -1 || true)")
          DARWIN_ARM=$(basename "$(ls artifacts/darwin-aarch64/*.app.tar.gz 2>/dev/null | head -1 || true)")
          DARWIN_X64=$(basename "$(ls artifacts/darwin-x86_64/*.app.tar.gz 2>/dev/null | head -1 || true)")
          if [ -z "$EXE" ] || [ -z "$APPIMAGE" ] || [ -z "$DARWIN_ARM" ] || [ -z "$DARWIN_X64" ]; then
            echo "::error::安装包不完整: windows-x86_64=$EXE, linux-x86_64=$APPIMAGE, darwin-aarch64=$DARWIN_ARM, darwin-x86_64=$DARWIN_X64"
            exit 1
          fi
          ASSETS_JSON="[{\"target\":\"windows-x86_64\",\"file\":\"$EXE\"},{\"target\":\"linux-x86_64\",\"file\":\"$APPIMAGE\"},{\"target\":\"darwin-aarch64\",\"file\":\"$DARWIN_ARM\"},{\"target\":\"darwin-x86_64\",\"file\":\"$DARWIN_X64\"}]"

          # 双清单模式(带扩展字段，updater 忽略未知字段；仅 URL 前缀不同)：直连 latest.json / 国内加速 latest-cn.json
          node scripts/build-latest-json.mjs \
            --name "$APP_NAME" \
            --repo "$RELEASES_REPO" \
            --tag "$TAG" \
            --assets "$ASSETS_JSON" \
            --dir artifacts \
            --proxy-prefix "" \
            --extended \
            --output artifacts/latest.json

          node scripts/build-latest-json.mjs \
            --name "$APP_NAME" \
            --repo "$RELEASES_REPO" \
            --tag "$TAG" \
            --assets "$ASSETS_JSON" \
            --dir artifacts \
            --extended \
            --output artifacts/latest-cn.json

      - name: Publish to Release Repo
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          set -e
          NOTES="$APP_NAME $TAG 安装包与双清单（latest.json 直连 / latest-cn.json 加速），客户端 updater 按顺序自动回退。"
          cd artifacts
          FILES=()
          while IFS= read -r -d '' f; do FILES+=("$f"); done < <(find . -type f -print0)

          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖资产并更新..."
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$RELEASES_REPO"
            gh release edit "$TAG" \
              --repo "$RELEASES_REPO" \
              --title "$APP_NAME $TAG" \
              --notes "$NOTES" \
              --latest
          else
            echo "创建全新 Release $TAG..."
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$RELEASES_REPO" \
              --title "$APP_NAME $TAG" \
              --notes "$NOTES" \
              --latest
          fi
