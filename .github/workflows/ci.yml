# CI: 前端与跨平台 Rust 门禁（同轨运行与产物单源复用）
# 触发: main 分支 push、PR 与手动调度
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job 1: 前端质量检查与打包，上传 dist/ 作为单源产物
  quality:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend Check (lint + typecheck + test)
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          compression-level: 1

  # Job 2: 跨平台 Rust 门禁免装前端环境，直接复用 frontend-dist
  rust:
    name: Rust Gate (${{ matrix.os }})
    needs: [quality]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # 优化 Windows 磁盘 IO，避免杀毒实时扫描海量编译临时文件
      - name: Optimize Windows Defender for Rust builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$HOME\.cargo" -ErrorAction SilentlyContinue

      # Tauri v2 Linux 系统依赖（剔除推荐包加速安装，换源规避 Azure 节点限速）
      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list || true
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file patchelf libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # 下载前端单源产物供 tauri build.rs / generate_context 校验
      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 代码格式检查单平台运行即可，避免 Windows 重复执行
      - name: Rust Format
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
