[package]
name = "z-store"
version = "0.4.0"
description = "Cross-platform open-source app store based on GitHub Releases"
authors = ["superMC"]
edition = "2021"

[lib]
name = "zstore_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1"
time = { version = "0.3", features = ["macros", "local-offset", "formatting"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
regex = "1.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["miniz_oxide"] }
xz2 = "0.1"
futures-util = "0.3"
urlencoding = "2.1"
rfd = "0.15"
toml = "0.8"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
