name: 开源广场投稿 / Launchpad submission
description: 把你的开源作品提交到 ZStore 开源广场（免费新品池或置顶推荐） / Launch your open-source app on ZStore Launchpad
title: "[Launchpad] "
labels: ["launchpad-submission"]
body:
  - type: markdown
    attributes:
      value: |
        感谢投稿！提交后机器人会自动体检仓库（公开、OSI 协议、Release 安装包）并回复预览。
        Thanks for launching! A bot will check your repository (public, OSI license, release assets) and reply with a preview.

        仅接受 OSI 认证开源协议且提供可下载安装包的公开仓库，置顶推荐同样适用该门槛。
        Only public repositories with an OSI-approved license and downloadable release assets are accepted — Spotlight included.
  - type: input
    id: repo_url
    attributes:
      label: 开源仓库地址 / Repository URL
      description: GitHub / Codeberg / Gitea / GitLab 公开仓库地址
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: app_name
    attributes:
      label: 应用名称 / App name
      placeholder: HyperTerm
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 功能分类 / Category
      options:
        - dev — 开发编程 / Developer tools
        - system — 系统实用 / System utilities
        - network — 网络工具 / Networking
        - media — 影音播放 / Media
        - security — 安全加密 / Security
        - graphics — 图形创作 / Graphics
        - office — 办公协同 / Productivity
        - reading — 阅读学习 / Reading
        - ops — 运维部署 / DevOps
        - games — 休闲游戏 / Games
    validations:
      required: true
  - type: textarea
    id: maker_note
    attributes:
      label: 一句话自荐 / Maker note
      description: 中文一句话介绍（建议 20~120 字，上限 140 字，会折叠为单行）
      placeholder: 重写了 WebGPU 渲染管线，万行滚动依旧丝滑。
    validations:
      required: true
  - type: textarea
    id: maker_note_en
    attributes:
      label: 英文自荐语 / Maker note (English)
      description: 可选，英文界面优先展示
    validations:
      required: false
  - type: dropdown
    id: launch_tier
    attributes:
      label: 上架档位 / Launch tier
      options:
        - free — 免费加入「最新上架」新品池 / Free listing in Recent Launches
        - spotlight-7d — 申请顶部「置顶推荐」7 天赞助位 / Spotlight for 7 days
        - spotlight-14d — 申请顶部「置顶推荐」14 天赞助位 / Spotlight for 14 days
        - spotlight-30d — 申请顶部「置顶推荐」30 天赞助位 / Spotlight for 30 days
    validations:
      required: true
  - type: input
    id: sponsor_order_ref
    attributes:
      label: 赞助凭证尾号 / Sponsor order reference
      description: |
        ⚠️ 本 Issue 公开可见：仅填写第三方收款订单号或交易号后 6 位供维护者核对，切勿填写任何密钥、账号或个人敏感信息。
        ⚠️ This issue is public: only enter an order number or the last 6 characters of a transaction ID. Never paste keys, account details or personal data.
    validations:
      required: false
  - type: input
    id: custom_icon_url
    attributes:
      label: 自定义图标 / Custom icon URL
      description: 可选，透明背景 https:// 直链
      placeholder: https://example.com/icon.png
    validations:
      required: false
  - type: input
    id: homepage
    attributes:
      label: 项目主页 / Homepage
      placeholder: https://example.com
    validations:
      required: false
  - type: input
    id: linked_discussion_url
    attributes:
      label: 关联 Discussion / Linked discussion URL
      description: 可选，绑定你自有 GitHub 仓库已开启的 Discussion；留空由平台自动创建专属讨论帖
      placeholder: https://github.com/owner/repo/discussions/1
    validations:
      required: false
  - type: checkboxes
    id: floss_confirm
    attributes:
      label: 开源承诺 / FLOSS confirmation
      options:
        - label: 项目采用 OSI 认证开源协议，提供可直接下载安装的 Release 构建资产，且不含恶意代码或闭源商业捆绑 / The project uses an OSI-approved license, ships installable release assets, and bundles no malware or closed-source components
          required: true
